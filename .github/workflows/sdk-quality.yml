name: SDK Quality

on:
  push:
    branches: [main]
    paths:
      - 'sdks/**'
      - '.github/workflows/sdk-quality.yml'
      - '.github/workflows/publish-npm.yml'
      - '.github/workflows/publish-pypi.yml'
      - '.github/workflows/publish-pubdev.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/**'
      - '.github/workflows/sdk-quality.yml'
      - '.github/workflows/publish-npm.yml'
      - '.github/workflows/publish-pypi.yml'
      - '.github/workflows/publish-pubdev.yml'

jobs:
  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/javascript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - run: npm pack --dry-run

  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: sdks/python/src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s sdks/python/tests -v
      - run: python -m pip install --upgrade build
      - run: python -m build sdks/python --outdir sdks/python/dist

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dart
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test
      - run: dart pub publish --dry-run
