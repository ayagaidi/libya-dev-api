name: Format v0.1 Once

on:
  push:
    branches: [feat/v0.1-foundation]
    paths:
      - '.github/workflows/format-v0.1-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/v0.1-foundation

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies and create lock file
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply Laravel Pint
        run: vendor/bin/pint

      - name: Commit formatting and lock file
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -f composer.lock ] && git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format v0.1 foundation and lock dependencies"
          git push origin HEAD:feat/v0.1-foundation
