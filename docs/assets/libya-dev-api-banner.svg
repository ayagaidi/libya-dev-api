<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Libya Dev API</title>
  <desc id="desc">Open developer API for Libya: locations, phone validation, telecom metadata and reusable public developer data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061525"/>
      <stop offset="0.55" stop-color="#0b2237"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00a95c"/>
      <stop offset="1" stop-color="#14d684"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1600" height="640" rx="30" fill="url(#bg)"/>
  <circle cx="1320" cy="65" r="260" fill="#0f7048" opacity=".10"/>
  <circle cx="1460" cy="520" r="330" fill="#d5162a" opacity=".07"/>

  <!-- Libya flag accent -->
  <g transform="translate(70 52)">
    <rect width="118" height="66" rx="10" fill="#e3212d"/>
    <rect y="22" width="118" height="28" fill="#05070b"/>
    <rect y="50" width="118" height="16" rx="0 0 10 10" fill="#149447"/>
    <path d="M70 36a12 12 0 1 1-4-9.1A9.3 9.3 0 1 0 70 36Z" fill="#fff"/>
    <path d="m77 27 2.3 4.6 5.1.7-3.7 3.6.9 5.1-4.6-2.4-4.5 2.4.8-5.1-3.7-3.6 5.1-.7Z" fill="#fff"/>
  </g>

  <text x="220" y="92" fill="#b9c6d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" letter-spacing="6">OPEN DATA · OPEN SOURCE · LIBYA</text>

  <text x="74" y="224" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="92" font-weight="800">Libya <tspan fill="url(#green)">Dev</tspan> API</text>
  <text x="78" y="278" fill="#d5dee7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="500">The open developer API for Libya</text>
  <text x="78" y="326" fill="#8fa5b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">One stable HTTP/JSON interface · usable from any language or framework</text>

  <!-- feature chips -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600">
    <g transform="translate(78 378)"><rect width="176" height="58" rx="16" fill="#102c3f" stroke="#1d5267"/><text x="24" y="37" fill="#eff7fb">📍 Locations</text></g>
    <g transform="translate(270 378)"><rect width="160" height="58" rx="16" fill="#102c3f" stroke="#1d5267"/><text x="24" y="37" fill="#eff7fb">☎ Phone</text></g>
    <g transform="translate(446 378)"><rect width="176" height="58" rx="16" fill="#102c3f" stroke="#1d5267"/><text x="24" y="37" fill="#eff7fb">📡 Telecom</text></g>
    <g transform="translate(638 378)"><rect width="174" height="58" rx="16" fill="#102c3f" stroke="#1d5267"/><text x="24" y="37" fill="#eff7fb">◎ OpenAPI</text></g>
  </g>

  <text x="78" y="500" fill="#7fcba5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22">Laravel 13 · REST · OpenAPI 3.1 · JSON · Tests · CI</text>
  <text x="78" y="552" fill="#eef5f8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650">From Libya, for developers everywhere. 🇱🇾</text>

  <!-- terminal -->
  <g filter="url(#shadow)" transform="translate(920 125)">
    <rect width="600" height="390" rx="24" fill="#07111d" stroke="#254259" stroke-width="2"/>
    <rect width="600" height="56" rx="24" fill="#0c1c2b"/>
    <circle cx="30" cy="28" r="7" fill="#ff5f57"/><circle cx="54" cy="28" r="7" fill="#febc2e"/><circle cx="78" cy="28" r="7" fill="#28c840"/>
    <text x="110" y="36" fill="#8798a8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">libya-dev-api</text>

    <rect x="30" y="88" width="76" height="34" rx="9" fill="#083e32"/>
    <text x="49" y="111" fill="#39e59b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700">GET</text>
    <text x="126" y="112" fill="#f1f5f9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19">/api/v1/locations/municipalities</text>

    <text x="34" y="165" fill="#91a4b4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">{</text>
    <text x="58" y="200" fill="#d6a84d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">"data"</text><text x="126" y="200" fill="#91a4b4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">: [</text>
    <text x="82" y="235" fill="#91a4b4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">{</text>
    <text x="108" y="270" fill="#d6a84d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">"slug"</text><text x="177" y="270" fill="#91a4b4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">: </text><text x="195" y="270" fill="#6de0bb" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">"tripoli-center"</text>
    <text x="108" y="305" fill="#d6a84d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">"name_ar"</text><text x="198" y="305" fill="#91a4b4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">: </text><text x="216" y="305" fill="#6de0bb" font-family="Arial,sans-serif" font-size="18">"طرابلس المركز"</text>
    <text x="108" y="340" fill="#d6a84d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">"name_en"</text><text x="198" y="340" fill="#91a4b4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">: </text><text x="216" y="340" fill="#6de0bb" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">"Tripoli Center"</text>
    <text x="82" y="375" fill="#91a4b4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">}</text>
  </g>

  <path d="M0 612 C360 560 520 650 850 604 C1130 565 1280 570 1600 500 L1600 640 L0 640 Z" fill="#149447" opacity=".9"/>
  <path d="M0 622 C360 570 520 660 850 614 C1130 575 1280 580 1600 510" fill="none" stroke="#05070b" stroke-width="20"/>
  <path d="M0 631 C360 580 520 670 850 624 C1130 585 1280 590 1600 520" fill="none" stroke="#e3212d" stroke-width="14"/>
</svg>
